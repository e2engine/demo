kind: Environment
version: 1.0.0
name: payment-demo
description: dependencies for the E2Engine payment demo

spec:
  services:
    - id: fraud
      kind: http
      mode: mocked
      address: 0.0.0.0:8081
      fixtures:
        - when:
            http:
              method: POST
              path: /check
              body: '{"accountId":"acc-001","amount":12500,"currency":"EUR"}'
          then:
            http:
              status: 200
              headers:
                Content-Type:
                  - application/json
              body: '{"approved":true}'

        - when:
            http:
              method: POST
              path: /check
              body: '{"accountId":"acc-002","amount":12500,"currency":"EUR"}'
          then:
            http:
              status: 200
              headers:
                Content-Type:
                  - application/json
              body: '{"approved":true}'

        - when:
            http:
              method: POST
              path: /check
              body: '{"accountId":"acc-003","amount":12500,"currency":"EUR"}'
          then:
            http:
              status: 200
              headers:
                Content-Type:
                  - application/json
              body: '{"approved":false}'

    - id: account
      kind: grpc
      mode: real
      address: 0.0.0.0:8082
      grpc_target: 127.0.0.1:50051
      proto:
        external:
          file: ./proto/account.proto
          service: account.v1.AccountService

    - id: notification
      kind: grpc
      mode: mocked
      address: 0.0.0.0:8083
      proto:
        internal:
          package: notification.v1
          service: NotificationService
          methods:
            - name: Send
              request:
                fields:
                  - name: account_id
                    type: string
                  - name: payment_id
                    type: string
                  - name: amount
                    type: int64
                  - name: currency
                    type: string
              response:
                fields: []
      fixtures:
        - when:
            grpc:
              method: Send
              message:
                account_id: acc-001
                payment_id: payment-1
                amount: 12500
                currency: EUR
          then:
            grpc:
              status: OK
              message: {}